name: Backfill Docker Hub images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy historical release images
        shell: bash
        run: |
          set -euo pipefail

          source_image="ghcr.io/${{ github.repository }}"
          destination_image="${{ secrets.DOCKERHUB_USERNAME }}/sigenergy-exporter"

          docker buildx imagetools create \
            --tag "${destination_image}:0.1.0" \
            "${source_image}:0.1.0"

          docker buildx imagetools create \
            --tag "${destination_image}:0.1.1" \
            --tag "${destination_image}:0.1" \
            "${source_image}:0.1.1"

          docker buildx imagetools create \
            --tag "${destination_image}:0.2.0" \
            --tag "${destination_image}:0.2" \
            --tag "${destination_image}:latest" \
            "${source_image}:0.2.0"

      - name: Verify Docker Hub images
        shell: bash
        run: |
          set -euo pipefail

          destination_image="${{ secrets.DOCKERHUB_USERNAME }}/sigenergy-exporter"
          for tag in 0.1.0 0.1.1 0.1 0.2.0 0.2 latest; do
            docker buildx imagetools inspect "${destination_image}:${tag}"
          done
