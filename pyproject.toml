[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sigenergy-exporter"
version = "0.2.0"
description = "Prometheus exporter for Sigenergy plants over Modbus TCP"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Francesc Domene" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "prometheus-client>=0.20,<1",
  "pymodbus>=3.11,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["ruff==0.12.5"]

[project.scripts]
sigenergy-exporter = "sigenergy_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
